version: '3.8'

networks:
  mlops-net:
    driver: bridge

volumes:
  postgres_data:
  mlflow_data:
  prometheus_data:
  grafana_data:

services:
  # --- INFRASTRUCTURE SERVICES ---
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: mlops_user
      POSTGRES_PASSWORD: mlops_password
      POSTGRES_DB: mlops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mlops-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mlops_user -d mlops_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    networks:
      - mlops-net

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - /home/da25m591/mounts/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    networks:
      - mlops-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - mlops-net

  airflow-webserver:
    image: ghcr.io/bmoinak98/mlops-project-team23/airflow:latest
    container_name: airflow-webserver
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlops_user:mlops_password@postgres:5432/mlops_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    ports:
      - "8080:8080"
    volumes:
      - /home/da25m591/mounts/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/da25m591/data:/opt/data
      - /home/da25m591/mounts/src:/app/src
    networks:
      - mlops-net
    command: webserver

  airflow-scheduler:
    image: ghcr.io/bmoinak98/mlops-project-team23/airflow:latest
    container_name: airflow-scheduler
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlops_user:mlops_password@postgres:5432/mlops_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    volumes:
      - /home/da25m591/mounts/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/da25m591/data:/opt/data
      - /home/da25m591/mounts/src:/app/src
    networks:
      - mlops-net
    command: scheduler

  # --- APPLICATION SERVING ---
  fastapi:
    image: ghcr.io/bmoinak98/mlops-project-team23/fastapi:latest
    container_name: fastapi
    restart: always
    ports:
      - "5910:5910"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: postgresql://mlops_user:mlops_password@postgres:5432/mlops_db
    volumes:
      - /home/da25m591/mounts/src/api:/app/api
    command: uvicorn api.main:app --host 0.0.0.0 --port 5910 --reload
    networks:
      - mlops-net
