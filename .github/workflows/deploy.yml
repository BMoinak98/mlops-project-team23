name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      # Server Setup
      setup_server:
        description: 'SETUP: Init folders & sync docker-compose.yml'
        type: boolean
        default: false
      # Infrastructure Deployments
      deploy_infra_db:
        description: 'INFRA: Deploy PostgreSQL Container'
        type: boolean
        default: false
      deploy_infra_mlflow:
        description: 'INFRA: Deploy MLflow Container'
        type: boolean
        default: false
      deploy_infra_obsv:
        description: 'INFRA: Deploy Grafana & Prometheus'
        type: boolean
        default: false
      deploy_infra_runtime:
        description: 'INFRA: Deploy Airflow Runtime Containers'
        type: boolean
        default: false
      deploy_infra_api:
        description: 'INFRA: Deploy FastAPI Container'
        type: boolean
        default: false
      # Image Builds
      build_airflow_image:
        description: 'BUILD: Build & Push Airflow Image'
        type: boolean
        default: false
      build_fastapi_image:
        description: 'BUILD: Build & Push FastAPI Image'
        type: boolean
        default: false
      # Code Deployments
      deploy_code_ml:
        description: 'CODE: Push ML Scripts to Server'
        type: boolean
        default: false
      deploy_code_dag:
        description: 'CODE: Push DAG Files to Server'
        type: boolean
        default: false
      deploy_code_api:
        description: 'CODE: Push FastAPI Code to Server'
        type: boolean
        default: false

jobs:
  setup_server:
    if: github.event_name == 'push' || inputs.setup_server == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project directory structure on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/da25m591/project/dags
            mkdir -p /home/da25m591/project/src/data_engineering
            mkdir -p /home/da25m591/project/src/api
            mkdir -p /home/da25m591/project/config
            mkdir -p /home/da25m591/project/logs
            mkdir -p /home/da25m591/data
            mkdir -p /home/da25m591/dvc_remote
      - name: Push docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,config/*,.dvc/*,data/raw/*.dvc"
          target: "/home/da25m591/project/"

      - name: Hydrate raw dataset from DVC store on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/da25m591/project
            dvc config cache.dir /home/da25m591/dvc_remote
            dvc checkout -f data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv.dvc
            cp data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv /home/da25m591/data/raw/


  # --- IMAGE BUILDS (parallel) ---
  build_airflow_image:
    if: github.event_name == 'push' || inputs.build_airflow_image == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build & Push Airflow Image
        run: |
          docker build -t ghcr.io/bmoinak98/mlops-project-team23/airflow:latest -f docker/Dockerfile.airflow .
          docker push ghcr.io/bmoinak98/mlops-project-team23/airflow:latest

  build_fastapi_image:
    if: github.event_name == 'push' || inputs.build_fastapi_image == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build & Push FastAPI Image
        run: |
          docker build -t ghcr.io/bmoinak98/mlops-project-team23/fastapi:latest -f docker/Dockerfile.api .
          docker push ghcr.io/bmoinak98/mlops-project-team23/fastapi:latest

  # --- INFRASTRUCTURE MANUAL JOBS ---
  deploy_infra_db:
    if: inputs.deploy_infra_db == true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Postgres
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/da25m591/project
            cd /home/da25m591/project
            docker compose up -d postgres

  deploy_infra_mlflow:
    if: inputs.deploy_infra_mlflow == true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy MLflow
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/da25m591/project
            cd /home/da25m591/project
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose up -d mlflow

  deploy_infra_obsv:
    if: inputs.deploy_infra_obsv == true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Observability
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/da25m591/project
            cd /home/da25m591/project
            docker compose up -d prometheus grafana

  deploy_infra_runtime:
    if: inputs.deploy_infra_runtime == true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Airflow Infrastructure
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/da25m591/project
            cd /home/da25m591/project
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull airflow-init
            AIRFLOW__CORE__FERNET_KEY="${{ secrets.FERNET_KEY }}" docker compose up airflow-init
            AIRFLOW__CORE__FERNET_KEY="${{ secrets.FERNET_KEY }}" docker compose up -d --no-deps airflow-webserver airflow-scheduler
            docker exec -u 0 airflow-scheduler mkdir -p /mlflow
            docker exec -u 0 airflow-scheduler chmod -R 777 /mlflow

  deploy_infra_api:
    if: inputs.deploy_infra_api == true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy FastAPI Infrastructure
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/da25m591/project
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull fastapi
            docker compose up -d --no-deps fastapi

  # --- CODE SYNC MANUAL JOBS ---
  deploy_code_dag:
    if: inputs.deploy_code_dag == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push DAG files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dags/"
          target: "/home/da25m591/project/dags/"
          strip_components: 1

  deploy_code_ml:
    if: inputs.deploy_code_ml == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push ML scripts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "src/data_engineering/"
          target: "/home/da25m591/project/src/data_engineering/"
          strip_components: 2

  deploy_code_api:
    if: inputs.deploy_code_api == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push API code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "src/api/"
          target: "/home/da25m591/project/src/api/"
          strip_components: 2