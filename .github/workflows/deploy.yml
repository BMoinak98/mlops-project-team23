name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      # Infrastructure Deployments
      deploy_infra_db:
        description: 'INFRA: Deploy PostgreSQL Container'
        type: boolean
        default: false
      deploy_infra_mlflow:
        description: 'INFRA: Deploy MLflow Container'
        type: boolean
        default: false
      deploy_infra_obsv:
        description: 'INFRA: Deploy Grafana & Prometheus'
        type: boolean
        default: false
      deploy_infra_airflow:
        description: 'INFRA: Deploy Airflow Containers'
        type: boolean
        default: false
      deploy_infra_mlcode:
        description: 'INFRA: Pull ML-Runner Image on Host'
        type: boolean
        default: false
      deploy_infra_api:
        description: 'INFRA: Deploy FastAPI Container'
        type: boolean
        default: false
      # Image Builds
      build_airflow_image:
        description: 'BUILD: Build & Push Airflow Image'
        type: boolean
        default: false
      build_mlrunner_image:
        description: 'BUILD: Build & Push ML-Runner Image'
        type: boolean
        default: false
      build_fastapi_image:
        description: 'BUILD: Build & Push FastAPI Image'
        type: boolean
        default: false
      # Code Deployments
      deploy_code_ml:
        description: 'CODE: Sync ML Scripts to Mounts'
        type: boolean
        default: false
      deploy_code_dag:
        description: 'CODE: Sync DAG Files to Mounts'
        type: boolean
        default: false
      deploy_code_api:
        description: 'CODE: Sync FastAPI Code to Mounts'
        type: boolean
        default: false

jobs:
  # --- IMAGE BUILDS (parallel) ---
  # Each job runs on: push to main  OR  manual dispatch with its checkbox ticked

  build_airflow_image:
    if: github.event_name == 'push' || inputs.build_airflow_image == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build & Push Airflow Image
        run: |
          docker build -t ghcr.io/bmoinak98/mlops-project-team23/airflow:latest -f docker/Dockerfile.airflow .
          docker push ghcr.io/bmoinak98/mlops-project-team23/airflow:latest

  build_mlrunner_image:
    if: github.event_name == 'push' || inputs.build_mlrunner_image == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build & Push ML-Runner Image
        run: |
          docker build -t ghcr.io/bmoinak98/mlops-project-team23/ml-runner:latest -f docker/Dockerfile.mlcode .
          docker push ghcr.io/bmoinak98/mlops-project-team23/ml-runner:latest

  build_fastapi_image:
    if: github.event_name == 'push' || inputs.build_fastapi_image == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build & Push FastAPI Image
        run: |
          docker build -t ghcr.io/bmoinak98/mlops-project-team23/fastapi:latest -f docker/Dockerfile.api .
          docker push ghcr.io/bmoinak98/mlops-project-team23/fastapi:latest

  # --- INFRASTRUCTURE MANUAL JOBS ---
  deploy_infra_db:
    if: inputs.deploy_infra_db == true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Postgres
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/da25m591/project
            docker compose up -d postgres

  deploy_infra_mlflow:
    if: inputs.deploy_infra_mlflow == true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy MLflow
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/da25m591/project
            docker compose up -d mlflow

  deploy_infra_obsv:
    if: inputs.deploy_infra_obsv == true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Observability
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/da25m591/project
            docker compose up -d prometheus grafana

  deploy_infra_airflow:
    if: inputs.deploy_infra_airflow == true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Airflow Infrastructure
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/da25m591/project
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull airflow-webserver airflow-scheduler
            AIRFLOW__CORE__FERNET_KEY="${{ secrets.FERNET_KEY }}" docker compose up -d --no-deps airflow-webserver airflow-scheduler

  deploy_infra_mlcode:
    if: inputs.deploy_infra_mlcode == true
    runs-on: ubuntu-latest
    steps:
      - name: Pull ML-Runner Image
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/bmoinak98/mlops-project-team23/ml-runner:latest

  deploy_infra_api:
    if: inputs.deploy_infra_api == true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy FastAPI Infrastructure
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/da25m591/project
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull fastapi
            docker compose up -d --no-deps fastapi

  # --- CODE SYNC MANUAL JOBS ---
  deploy_code_dag:
    if: inputs.deploy_code_dag == true
    runs-on: ubuntu-latest
    steps:
      - name: Pull Main & Copy DAG Files to Mount Directory
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/da25m591/project
            git checkout main
            git pull origin main
            mkdir -p /home/da25m591/mounts/dags
            cp -r /home/da25m591/project/dags/* /home/da25m591/mounts/dags/

  deploy_code_ml:
    if: inputs.deploy_code_ml == true
    runs-on: ubuntu-latest
    steps:
      - name: Pull Main & Copy ML Code to Mount Directory
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/da25m591/project
            git checkout main
            git pull origin main
            mkdir -p /home/da25m591/mounts/src/data_engineering /home/da25m591/mounts/src/training
            cp -r /home/da25m591/project/src/data_engineering/* /home/da25m591/mounts/src/data_engineering/
            cp -r /home/da25m591/project/src/training/* /home/da25m591/mounts/src/training/

  deploy_code_api:
    if: inputs.deploy_code_api == true
    runs-on: ubuntu-latest
    steps:
      - name: Pull Main & Copy API Code to Mount Directory
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/da25m591/project
            git checkout main
            git pull origin main
            mkdir -p /home/da25m591/mounts/src/api
            cp -r /home/da25m591/project/src/api/* /home/da25m591/mounts/src/api/